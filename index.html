    }
  }
  function claimUsername(name, cb){
    const key = usernameKey(name);
    const ref = db.ref('usernames/' + key);
    primed(ref, (snap, done) => {
      ref.transaction(cur => {
        if (cur && cur.uid !== myUid && (cur.online || serverNow() - cur.t < USERNAME_HOLD_MS)) return;
        return {uid: myUid, name: name, online: true, t: serverNow()};
      }, (err, committed) => {
        done();
        if (err){ toast('Could not verify username'); cb(false, true); return; }
        if (committed){
          let prev = null;
          try { prev = localStorage.getItem('dk_username'); } catch(e){}
          if (prev && usernameKey(prev) !== key) db.ref('usernames/' + usernameKey(prev)).remove().catch(() => {});
          holdUsername(key);
        }
        cb(committed);
      }, false);
    });
  }
  function verifySavedUsername(){
    let n = null;
    try { n = localStorage.getItem('dk_username'); } catch(e){}
    if (!n) return;
    claimUsername(n, (ok, failed) => {
      if (ok || failed) return;
      try { localStorage.removeItem('dk_username'); } catch(e){}
      username = 'Player';
      usernameInput.value = '';
      updateAvatarLetter();
      playButton.disabled = true;
      toast('Username "' + n + '" is taken, choose another');
    });
  }

  /* ---------- init: Firebase app + anonymous auth + clock offset ---------- */
  function whenReady(fn, onFail){
    if (!db){ toast('Multiplayer unavailable (offline)'); if (onFail) onFail(); return; }
    if (netReady){ fn(); return; }
    toast('Connecting...', true);
    readyQueue.push(fn);
  }

  function onAuthReady(){
    if (netReady) return;
    netReady = true;
    db.ref('.info/serverTimeOffset').on('value', s => { serverOffset = s.val() || 0; });
    if (readyQueue.length) hideToast();
    readyQueue.splice(0).forEach(f => f());
    verifySavedUsername();
    tryResume();
  }

  function initFirebase(){
    if (typeof firebase === 'undefined'){ console.warn('Firebase SDK not loaded'); return; }
    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      auth = firebase.auth();
      auth.onAuthStateChanged(user => {
        if (user){ myUid = user.uid; onAuthReady(); }
      });
      auth.signInAnonymously().catch(err => {
        console.warn('Anonymous sign-in failed (enable it in Firebase console > Authentication):', err);
        let u = null;
        try { u = localStorage.getItem('dk_uid'); } catch(e){}
        if (!u){
          u = 'u' + Math.random().toString(36).slice(2) + Date.now().toString(36);
          try { localStorage.setItem('dk_uid', u); } catch(e){}
        }
        myUid = u;
        onAuthReady();
      });
    } catch(e){
      console.warn('Firebase init failed', e);
      db = null;
    }
  }

  /* ---------- room lifecycle: host ---------- */
  function primed(ref, run){
    const keep = () => {};
    ref.on('value', keep);
    ref.once('value').then(
      snap => run(snap, () => ref.off('value', keep)),
      () => { ref.off('value', keep); toast('Connection error'); }
    );
  }

  function hostRoom(attempt){
    attempt = attempt || 0;
    whenReady(() => {
      if (!hostScreen.classList.contains('open')) return;
      if (attempt > 12){ roomIdDisplay.textContent = '-'; toast('No free rooms, try again'); return; }
      const id = String(generateRoomId());
      const ref = db.ref('rooms/' + id);
      primed(ref, (snap, done) => {
        const cur = snap.val();
        if (cur && !isStaleRoom(cur)){ done(); hostRoom(attempt + 1); return; }
        const now = serverNow();
        ref.transaction(c => {
          if (c && !isStaleRoom(c)) return;
          return {
            meta: {host: myUid, hostName: username, status: 'waiting', createdAt: now},
            state: freshState(1, now)
          };
        }, (err, committed) => {
          done();
          if (err){ toast('Connection error'); return; }
          if (!committed){ hostRoom(attempt + 1); return; }
          if (!hostScreen.classList.contains('open')){ ref.remove(); return; }
          roomIdDisplay.textContent = id;
          attachRoom(id, 'host');
          ref.onDisconnect().remove();      // waiting room vanishes if host disappears
          toast('Waiting for opponent...', true);
        }, false);
      });
    }, () => { hostScreen.classList.remove('open'); modeScreen.classList.add('open'); });
  }

  function cancelHostRoom(){
    hideToast();
    if (roomRef && myRole === 'host' && !matchStarted){
      const r = roomRef;
      detachAll();
      r.onDisconnect().cancel();
      r.remove();
      roomRef = null; roomId = null; myRole = null; roomMeta = null;
    }
  }

  /* ---------- room lifecycle: join ---------- */
  function joinRoom(raw){
    const id = String(raw || '').replace(/\D/g, '');
    if (id.length !== 3){ toast('Enter a 3-digit room ID'); return; }
    whenReady(() => {
      joinConfirmBtn.disabled = true;
      const metaRef = db.ref('rooms/' + id + '/meta');
      primed(metaRef, (snap, done) => {
        let reason = null;
        const t = serverNow();
        metaRef.transaction(cur => {
          if (!cur){ reason = 'notfound'; return; }
          if (cur.host === myUid){ reason = 'own'; return; }
          if (cur.guest && cur.guest !== myUid){ reason = 'full'; return; }
          if (cur.status !== 'waiting' && cur.guest !== myUid){ reason = 'full'; return; }
          cur.guest = myUid;
          cur.guestName = username;
          cur.status = 'playing';
          cur.startedAt = cur.startedAt || t;
          return cur;
        }, (err, committed) => {
          done();
          joinConfirmBtn.disabled = false;
          if (err){ toast('Connection error'); return; }
          if (!committed){
            toast(reason === 'full' ? 'Room is full' : (reason === 'own' ? "That's your room" : 'Room not found'));
            return;
          }
          attachRoom(id, 'guest');
        }, false);
      });
    });
  }

  function attachRoom(id, role){
    detachAll();
    roomId = id; myRole = role; roomRef = db.ref('rooms/' + id);
    matchStarted = false; roomMeta = null;
    listen(roomRef.child('meta'), 'value', snap => {
      const m = snap.val();
      if (!m){
        if (matchStarted && !gameOver) toast('Room closed');
        return;
      }
      roomMeta = m;
      if (m.guest && !matchStarted) beginMatch();
    });
  }

  function tryResume(){
    let s = null;
    try { s = JSON.parse(localStorage.getItem('dk_session') || 'null'); } catch(e){}
    if (!s || !s.room) return;
    db.ref('rooms/' + s.room).once('value').then(snap => {
      const r = snap.val();
      const ok = r && r.meta && r.state && !r.state.winner && r.meta.guest &&
                 (r.meta.host === myUid || r.meta.guest === myUid) &&
                 !(r.left && Object.keys(r.left).length) && !isStaleRoom(r);
      if (!ok){ clearSession(); return; }
      if (s.name) username = s.name;
      attachRoom(s.room, r.meta.host === myUid ? 'host' : 'guest');
    }).catch(() => {});
  }

  /* ---------- match start: attach all realtime channels ---------- */
  function beginMatch(){
    matchStarted = true;
    isOnline = true; isAIGame = false;
    document.body.classList.remove('aiMode');
    myColor = myRole === 'host' ? 'black' : 'gray';
    flipped = (myColor === 'gray');
    gameOver = false; localMoveNo = -1; gameNo = 0; animating = false;
    pendingState = null; turnSteps = []; rematchPending = false; rematchStarting = false; rematchIncoming = false; lastRematch = {};
    drawIncoming = false; wasOffline = false;
    attachTime = serverNow();
    chatMessages.innerHTML = '';
    clearChatBadge();
    initBoard(); current = 'black'; selected = null; legalMoves = []; chainActive = false;
    refreshMandatory(); render();
    if (myRole === 'host') roomRef.onDisconnect().cancel();
    hideToast();
    saveSession();
    startMatch(true);

    const opp = oppUid();

    // 1) authoritative game state (moves, turn, clock, winner)
    listen(roomRef.child('state'), 'value', onStateValue);

    // 2) connection + presence (onDisconnect marks me offline server-side)
    listen(db.ref('.info/connected'), 'value', snap => {
      if (snap.val() === true){
        const p = roomRef.child('presence/' + myUid);
        const TS = firebase.database.ServerValue.TIMESTAMP;
        p.onDisconnect().set({online: false, lastSeen: TS}).then(() => p.set({online: true, lastSeen: TS}));
        if (wasOffline){ wasOffline = false; toast('Back online'); }
      } else if (matchStarted){
        wasOffline = true;
        if (!gameOver) toast('Reconnecting...', true);
      }
    });
    if (opp){
      listen(roomRef.child('presence/' + opp), 'value', snap => {
        const p = snap.val();
        if (p && p.online){
          if (opponentGoneTimer){ clearTimeout(opponentGoneTimer); opponentGoneTimer = null; toast('Opponent reconnected'); }
          return;
        }
        if (!(p && p.online === false) || gameOver || opponentGoneTimer) return;
        toast('Opponent disconnected...', true);
        opponentGoneTimer = setTimeout(() => {
          opponentGoneTimer = null;
          if (!gameOver) claimResult(myColor, 'disconnect');
        }, 30000);
      });
    }

    // 3) chat
    listen(roomRef.child('chat').limitToLast(50), 'child_added', snap => {
      const m = snap.val();
      if (!m || typeof m.text !== 'string') return;
      const el = document.createElement('div');
      el.className = 'chatMsg ' + (m.uid === myUid ? 'me' : 'them');
      el.textContent = m.text;
      chatMessages.appendChild(el);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      if (m.uid !== myUid && m.t && m.t > attachTime && !chatPage.classList.contains('open')){
        unreadChat++;
        updateChatBadge();
        toast('New message');
      }
    });

    // 4) draw offers
    listen(roomRef.child('draw'), 'value', snap => {
      const d = snap.val();
      if (!d){
        if (drawIncoming){ drawIncoming = false; if (confirmMode === 'drawIncoming') closeConfirmModal(); }
        return;
      }
      if (d.from === myUid){
        if (d.status === 'declined'){
          closeConfirmModal();
          toast('Draw declined');
          roomRef.child('draw').remove();
        }
        return;
      }
      if (d.status === 'pending' && !gameOver && !drawIncoming){
        drawIncoming = true;
        confirmMode = 'drawIncoming';
        confirmText.textContent = 'ACCEPT DRAW?';
        confirmText.style.display = 'block';
        confirmButtons.style.display = 'flex';
        confirmLoading.style.display = 'none';
        confirmCancelBtn.style.display = 'none';
        confirmModal.classList.add('open');
        gameWrap.classList.add('blurred');
      }
    });

    // 5) rematch handshake (host performs the reset once both agreed)
    listen(roomRef.child('rematch'), 'value', snap => {
      const r = snap.val() || {};
      const o = oppUid();
      if (myRole === 'host' && gameOver && o && r[myUid] && r[o] && !rematchStarting) hostStartRematch();
      lastRematch = r;
      if (r.declined && r.declined === o){
        rematchPending = false;
        rematchBtn.textContent = 'Rematch';
        toast('Rematch request declined.');
        roomRef.child('rematch').remove();
        return;
      }
      checkIncomingRematch();
    });

    // 6) opponent left the room
    listen(roomRef.child('left'), 'value', snap => {
      const l = snap.val() || {};
      const o = oppUid();
      if (o && l[o]){
        toast('Opponent left the room');
        lastRematch = {};
        rematchIncoming = false;
        if (confirmMode === 'rematchIncoming') closeConfirmModal();
        rematchBtn.disabled = true;
        rematchBtn.style.opacity = '0.5';
      }
    });

    // 7) latency probe: RTT of a tiny acknowledged write, smoothed
    clearInterval(pingTimer);
    pingTimer = setInterval(() => {
      if (!roomRef) return;
      const t0 = performance.now();
      roomRef.child('ping/' + myUid).set(Date.now(), err => {
        if (!err) rtt = rtt * 0.7 + (performance.now() - t0) * 0.3;
      });
    }, 5000);
  }

  /* ---------- state synchronisation ---------- */
  function onStateValue(snap){
    const s = snap.val();
    if (!s || !isOnline) return;
    if (animating){ pendingState = s; return; }
    applyServerState(s);
  }

  function applyServerState(s){
    if (s.gameNo !== gameNo){ startFresh(s); return; }

    if (s.moveNo === localMoveNo){
      // echo of my own move, or a no-move update (timeout / surrender / draw)
      const st = effectiveStart(s);
      if (st !== turnStartedAtSrv && !s.winner){ turnStartedAtSrv = st; startTurnTimer(); }
      if (s.winner && !gameOver) finishFromState(s);
      return;
    }

    if (s.moveNo === localMoveNo + 1 && s.lastBy && s.lastBy !== myUid && s.lastMove){
      const seq = normalizeSeq(s.lastMove);
      const legal = seq.length && (s.turn === myColor || s.winner) &&
                    generateFullMoves(board, oppColor()).some(m => sameSeq(m, seq));
      if (!legal){
        if (s.winner){ hardSync(s); } else { claimResult(myColor, 'illegal'); }
        return;
      }
      playRemoteMove(s, seq);
      return;
    }

    hardSync(s);     // missed updates, rollback, reconnect: snapshot wins
  }

  function hardSync(s){
    board = deserializeBoard(s.board);
    current = s.turn;
    localMoveNo = s.moveNo;
    selected = null; legalMoves = []; chainActive = false; turnSteps = [];
    refreshMandatory();
    render();
    turnStartedAtSrv = effectiveStart(s);
    if (s.winner){ finishFromState(s); }
    else { gameOver = false; startTurnTimer(); }
  }

  function startFresh(s){
    gameNo = s.gameNo;
    gameStartMs = s.moveNo === 0 ? effectiveStart(s) : ((s.gameNo === 1 && roomMeta && roomMeta.startedAt) || null);
    gameOver = false;
    rematchPending = false; rematchStarting = false; rematchIncoming = false; lastRematch = {};
    winnerScreen.classList.remove('open');
    rematchBtn.textContent = 'Rematch';
    closeConfirmModal();
    hardSync(s);
  }

  function playRemoteMove(s, seq){
    animating = true;
    clearInterval(turnTimerInterval);
    selected = null; legalMoves = [];
    let i = 0;
    const finish = () => {
      board = deserializeBoard(s.board);              // authoritative result
      current = s.turn;
      localMoveNo = s.moveNo;
      animating = false;
      refreshMandatory();
      render();
      turnStartedAtSrv = s.turnStartedAt;
      if (s.winner) finishFromState(s); else startTurnTimer();
      if (pendingState){ const p = pendingState; pendingState = null; applyServerState(p); }
    };
    const next = () => {
      if (!isOnline) return;
      if (i >= seq.length){ finish(); return; }
      const st = seq[i++];
      const piece = board[st.fromR][st.fromC];
      const cap = st.capRow !== undefined;
      if (cap) playCaptureSound(); else playMoveSound();
      board[st.fromR][st.fromC] = null;
      board[st.toRow][st.toCol] = piece;
      if (cap) board[st.capRow][st.capCol] = null;
      tryPromote(st.toRow, st.toCol);
      render();
      setTimeout(next, cap ? 420 : 300);
    };
    next();
  }

  function finishFromState(s){
    if (gameOver && winnerScreen.classList.contains('open')) return;
    gameOver = true;
    stopTurnTimer();
    closeConfirmModal();
    drawIncoming = false;
    clearTimeout(opponentGoneTimer); opponentGoneTimer = null;
    let label;
    if (s.winner === 'draw') label = 'Draw';
    else if (s.winner === 'black') label = (roomMeta && roomMeta.hostName) || 'Black';
    else label = (roomMeta && roomMeta.guestName) || 'Gray';
    if (s.winner === 'black' || s.winner === 'gray') recordHistory(s);
    showWinnerScreen(s.winner, label);
    checkIncomingRematch();
  }

  /* ---------- sending my move (optimistic + transactional) ---------- */
  function submitOnlineMove(){
    const seq = turnSteps; turnSteps = [];
    const opp = oppColor();
    const expected = localMoveNo;
    const nextNo = expected + 1;
    const winner = generateFullMoves(board, opp).length > 0 ? null : myColor;
    const dur = seqDuration(seq);
    const boardStr = serializeBoard(board);

    // optimistic local commit: UI never waits for the network
    current = opp; selected = null; legalMoves = []; chainActive = false;
    localMoveNo = nextNo;
    refreshMandatory();
    turnStartedAtSrv = serverNow() + dur;
    startTurnTimer();

    roomRef.child('state').transaction(cur => {
      if (!cur || cur.winner || cur.gameNo !== gameNo || cur.moveNo !== expected || cur.turn !== myColor) return;
      const ns = {
        board: boardStr, turn: opp, moveNo: nextNo, gameNo: gameNo,
        turnStartedAt: serverNow() + dur, lastMove: seq, lastBy: myUid
      };
      if (winner){ ns.winner = winner; ns.reason = 'nomoves'; }
      return ns;
    }, (err, committed, snap) => {
      if (committed) return;
      const s = snap && snap.val();
      if (s){ toast('Resynced'); hardSync(s); }
    }, true);
  }

  /* ---------- match history (one record per finished game) ---------- */
  function recordHistory(s){
    try {
      if (!db || !roomId || !roomMeta) return;
      const hostN = roomMeta.hostName || 'Black';
      const guestN = roomMeta.guestName || 'Gray';
      const key = roomId + '_' + (roomMeta.createdAt || 0) + '_' + (s.gameNo || 0);
      const w = s.winner === 'black' ? hostN : guestN;
      const l = s.winner === 'black' ? guestN : hostN;
      const st = gameStartMs || (s.gameNo === 1 && roomMeta.startedAt) || null;
      db.ref('history/' + key).transaction(cur => {
        if (!cur) return {winner: w, loser: l, t: firebase.database.ServerValue.TIMESTAMP, startedAt: st};
        if (!cur.startedAt && st){ cur.startedAt = st; return cur; }
        return undefined;
      }).catch(() => {});
    } catch(e){}
  }

  window.dkLoadHistory = function(cb){
    whenReady(() => {
      db.ref('history').orderByChild('t').limitToLast(200).once('value').then(snap => {
        const out = [];
        snap.forEach(ch => { out.push(ch.val()); });
        cb(out.reverse());
      }).catch(() => cb(null));
    }, () => cb(null));
  };

  /* leaderboard = match history newer than the last admin "Clear Leaderboard" */
  window.dkLoadLeaderboard = function(cb){
    whenReady(() => {
      db.ref('leaderboardReset').once('value').then(s => s.val() || 0, () => 0).then(resetT => {
        window.dkLoadHistory(rows => cb(rows ? rows.filter(r => !resetT || (r.t || 0) > resetT) : rows));
      });
    }, () => cb(null));
  };

  /* admin settings: kind = 'usernames' | 'leaderboard' | 'history' */
  window.dkAdminClear = function(kind, cb){
    whenReady(() => {
      if (kind === 'leaderboard'){
        db.ref('leaderboardReset').set(firebase.database.ServerValue.TIMESTAMP)
          .then(() => cb(true)).catch(e => cb(false, e));
        return;
      }
      const node = kind === 'usernames' ? 'usernames' : 'history';
      db.ref(node).once('value').then(snap => {
        const upd = {};
        snap.forEach(ch => { upd[node + '/' + ch.key] = null; });
        if (!Object.keys(upd).length) return;
        return db.ref().update(upd);
      }).then(() => cb(true)).catch(e => cb(false, e));
    }, () => cb(false));
  };

  /* ---------- game end claims (idempotent, first writer wins) ---------- */
  function claimResult(winner, reason){
    if (!roomRef) return;
    const now = Date.now();
    if (now - lastClaimAt < 1500) return;
    lastClaimAt = now;
    roomRef.child('state').transaction(cur => {
      if (!cur || cur.winner || cur.gameNo !== gameNo) return;
      cur.winner = winner;
      cur.reason = reason;
      return cur;
    });
  }

  /* ---------- server-time turn clock ---------- */
  function startOnlineTimer(){
    clearInterval(turnTimerInterval);
    const tick = () => {
      if (gameOver){ clearInterval(turnTimerInterval); return; }
      const elapsed = (serverNow() - turnStartedAtSrv) / 1000;
      turnTimeLeft = Math.max(0, Math.min(TURN_TIME_LIMIT, Math.ceil(TURN_TIME_LIMIT - elapsed)));
      updateTurnTimerDisplay();
      if (animating) return;
      const overMs = (elapsed - TURN_TIME_LIMIT) * 1000;
      if (current === myColor){
        if (overMs >= 0) claimResult(oppColor(), 'timeout');
      } else if (overMs >= timeoutGrace()){
        claimResult(myColor, 'timeout');     // opponent stalled / offline
      }
    };
    tick();
    turnTimerInterval = setInterval(tick, 250);
  }

  /* ---------- chat / draw / rematch / leave ---------- */
  function sendOnlineChat(text){
    if (!roomRef) return;
    roomRef.child('chat').push({uid: myUid, text: text.slice(0, 200), t: firebase.database.ServerValue.TIMESTAMP});
  }

  function sendDrawRequest(){
    if (roomRef) roomRef.child('draw').set({from: myUid, status: 'pending'});
  }
  function cancelDrawRequest(){
    if (roomRef) roomRef.child('draw').remove();
  }
  function respondDraw(accept){
    drawIncoming = false;
    if (!roomRef) return;
    if (accept){
      claimResult('draw', 'draw');
      roomRef.child('draw').remove();
    } else {
      roomRef.child('draw').update({status: 'declined'});
    }
  }

  function requestRematch(){
    if (rematchPending || !roomRef) return;
    rematchPending = true;
    rematchBtn.textContent = 'Waiting...';
    roomRef.child('rematch').update({[myUid]: true, declined: null});
  }
  function checkIncomingRematch(){
    const r = lastRematch || {};
    const o = oppUid();
    const pending = !!(roomRef && o && r[o] && !r[myUid] && !r.declined);
    if (pending && gameOver && winnerScreen.classList.contains('open') && !rematchIncoming){
      rematchIncoming = true;
      confirmMode = 'rematchIncoming';
      confirmText.textContent = 'REMATCH REQUEST';
      confirmText.style.display = 'block';
      confirmYesBtn.textContent = 'Accept';
      confirmNoBtn.textContent = 'Decline';
      confirmButtons.style.display = 'flex';
      confirmLoading.style.display = 'none';
      confirmCancelBtn.style.display = 'none';
      confirmModal.classList.add('open');
      gameWrap.classList.add('blurred');
    } else if (!pending && rematchIncoming){
      rematchIncoming = false;
      if (confirmMode === 'rematchIncoming') closeConfirmModal();
    }
  }
  function respondRematch(accept){
    rematchIncoming = false;
    if (!roomRef) return;
    if (accept){
      roomRef.child('rematch/' + myUid).set(true);
    } else {
      roomRef.child('rematch').set({declined: myUid});
    }
  }
  function hostStartRematch(){
    rematchStarting = true;
    const base = 'rooms/' + roomId;
    const upd = {};
    upd[base + '/state'] = freshState(gameNo + 1, serverNow() + 800);
    upd[base + '/rematch'] = null;
    upd[base + '/draw'] = null;
    db.ref().update(upd).catch(() => { rematchStarting = false; });
  }

  function resetOnlineVars(){
    detachAll();
    clearInterval(pingTimer); pingTimer = null;
    clearTimeout(opponentGoneTimer); opponentGoneTimer = null;
    isOnline = false; myColor = 'black'; flipped = false; animating = false;
    pendingState = null; turnSteps = [];
    roomRef = null; roomId = null; roomMeta = null; myRole = null; matchStarted = false;
    rematchPending = false; rematchStarting = false; drawIncoming = false; rematchIncoming = false; lastRematch = {};
    rematchBtn.textContent = 'Rematch';
    rematchBtn.disabled = false;
    rematchBtn.style.opacity = '';
    clearChatBadge();
  }

  function leaveOnline(){
    hideToast();
    if (roomRef){
      const ref = roomRef, o = oppUid(), me = myUid;
      ref.child('presence/' + me).onDisconnect().cancel();
      ref.child('left').once('value').then(s => {
        const l = s.val() || {};
        if (!o || l[o]) ref.remove(); else ref.child('left/' + me).set(true);
      }).catch(() => {});
    }
    clearSession();
    resetOnlineVars();
  }

  initFirebase();
})();
</script>
<div id="adminPage">
  <div id="adminPageHeader">
    <span>ADMIN DASHBOARD</span>
    <span id="adminPageBack">✕</span>
  </div>
  <div id="adminPageBody">
    <div id="adminMenu">
      <button class="adminMenuBtn" id="adminHistoryBtn">History</button>
      <button class="adminMenuBtn" id="adminRegisterBtn">Register</button>
      <button class="adminMenuBtn" id="adminMatchBtn">Match</button>
      <button class="adminMenuBtn" id="adminSettingsBtn">Settings</button>
    </div>
  </div>
</div>
<div id="settingsPage">
  <div id="settingsPageHeader">
    <span>SETTINGS</span>
    <span id="settingsPageBack">✕</span>
  </div>
  <div id="settingsBody">
    <button class="settingsBtn danger" id="settingsDeleteUsernamesBtn">Delete All Player Usernames</button>
    <button class="settingsBtn warn" id="settingsClearLeaderboardBtn">Clear Leaderboard</button>
    <button class="settingsBtn info" id="settingsClearHistoryBtn">Clear History</button>
    <div id="settingsStatus"></div>
  </div>
</div>
<div id="settingsConfirm">
  <div id="settingsConfirmBox">
    <div id="settingsConfirmTitle"></div>
    <div id="settingsConfirmText"></div>
    <div id="settingsConfirmButtons">
      <button id="settingsConfirmCancel">Cancel</button>
      <button id="settingsConfirmOk">Confirm</button>
    </div>
  </div>
</div>
<div id="leaderboardPage">
  <div id="leaderboardPageHeader">
    <span>LEADERBOARD</span>
    <span id="leaderboardPageBack">✕</span>
  </div>
  <div id="leaderboardList"></div>
</div>
<div id="historyPage">
  <div id="historyPageHeader">
    <span>HISTORY</span>
    <span id="historyPageBack">✕</span>
  </div>
  <div id="historyList"></div>
</div>
<div id="adminModal">
  <div id="adminModalBox">
    <div id="adminTitle">Admin Access</div>
    <input id="adminPassInput" type="password" placeholder="Password" autocomplete="off">
    <div id="adminMsg"></div>
    <div id="adminButtons">
      <button id="adminCancelBtn">Cancel</button>
      <button id="adminEnterBtn">Enter</button>
    </div>
  </div>
</div>
<script>
(function(){
  const landing = document.getElementById('landingScreen');
  const modal = document.getElementById('adminModal');
  const input = document.getElementById('adminPassInput');
  const msg = document.getElementById('adminMsg');
  let tapCount = 0;
  const adminPage = document.getElementById('adminPage');
  document.getElementById('adminPageBack').addEventListener('click', () => adminPage.classList.remove('open'));
  const historyPage = document.getElementById('historyPage');
  const historyList = document.getElementById('historyList');
  function historyMsg(text){
    historyList.innerHTML = '';
    const m = document.createElement('div');
    m.className = 'historyEmpty';
    m.textContent = text;
    historyList.appendChild(m);
  }
  document.getElementById('adminHistoryBtn').addEventListener('click', () => {
    historyPage.classList.add('open');
    historyMsg('Loading...');
    if (!window.dkLoadHistory){ historyMsg('History unavailable'); return; }
    window.dkLoadHistory(rows => {
      if (!rows){ historyMsg('History unavailable'); return; }
      if (!rows.length){ historyMsg('No history yet'); return; }
      historyList.innerHTML = '';
      rows.forEach(r => {
        const item = document.createElement('div');
        item.className = 'historyItem';
        const row = document.createElement('div');
        row.className = 'historyRow';
        const w = document.createElement('span');
        w.className = 'historyWin';
        w.textContent = r.winner;
        const vs = document.createElement('span');
        vs.className = 'historyVs';
        vs.textContent = 'vs';
        const l = document.createElement('span');
        l.className = 'historyLoss';
        l.textContent = r.loser;
        row.appendChild(w); row.appendChild(vs); row.appendChild(l);

        const pad = n => (n < 10 ? '0' : '') + n;
        const when = r.startedAt || r.t;
        let dateText = '—', timeText = '—';
        if (when){
          const dt = new Date(when);
          dateText = pad(dt.getDate()) + '/' + pad(dt.getMonth() + 1) + '/' + dt.getFullYear();
        }
        if (r.startedAt){
          const st = new Date(r.startedAt);
          const h = st.getHours();
          timeText = ((h % 12) || 12) + ':' + pad(st.getMinutes()) + ' ' + (h >= 12 ? 'PM' : 'AM');
        }
        const details = document.createElement('div');
        details.className = 'historyDetails';
        [['Date Played', dateText], ['Game Start Time', timeText]].forEach(p => {
          const cell = document.createElement('div');
          const lab = document.createElement('div');
          lab.className = 'historyDetailLabel';
          lab.textContent = p[0];
          const val = document.createElement('div');
          val.className = 'historyDetailValue';
          val.textContent = p[1];
          cell.appendChild(lab); cell.appendChild(val);
          details.appendChild(cell);
        });
        row.addEventListener('click', () => {
          const open = details.classList.toggle('open');
          row.classList.toggle('active', open);
        });
        item.appendChild(row); item.appendChild(details);
        historyList.appendChild(item);
      });
    });
  });
  document.getElementById('historyPageBack').addEventListener('click', () => historyPage.classList.remove('open'));
  const leaderboardPage = document.getElementById('leaderboardPage');
  const leaderboardList = document.getElementById('leaderboardList');
  function leaderboardMsg(text){
    leaderboardList.innerHTML = '';
    const m = document.createElement('div');
    m.className = 'historyEmpty';
    m.textContent = text;
    leaderboardList.appendChild(m);
  }
  document.getElementById('leaderboardBubble').addEventListener('click', () => {
    leaderboardPage.classList.add('open');
    leaderboardMsg('Loading...');
    if (!window.dkLoadLeaderboard){ leaderboardMsg('Leaderboard unavailable'); return; }
    window.dkLoadLeaderboard(rows => {
      if (!rows){ leaderboardMsg('Leaderboard unavailable'); return; }
      if (!rows.length){ leaderboardMsg('No matches yet'); return; }
      const stats = {};
      rows.forEach(r => {
        if (!stats[r.winner]) stats[r.winner] = {name: r.winner, w: 0, l: 0};
        if (!stats[r.loser]) stats[r.loser] = {name: r.loser, w: 0, l: 0};
        stats[r.winner].w++;
        stats[r.loser].l++;
      });
      // score = number of wins; highest score first (ties: fewer losses, then name)
      const list = Object.values(stats).sort((a, b) => (b.w - a.w) || (a.l - b.l) || a.name.localeCompare(b.name));
      const el = (tag, cls, text) => {
        const n = document.createElement(tag);
        n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      };
      const addCrownFx = (badge, rank) => {
        const group = (cls, n) => {
          const c = el('span', cls);
          for (let k = 0; k < n; k++) c.appendChild(document.createElement('span'));
          badge.appendChild(c);
        };
        if (rank === 1){ badge.appendChild(el('span', 'cwBeam')); group('cwEmbers', 8); }
        else if (rank === 2) badge.appendChild(el('span', 'cwSheen'));
        else group('cwOrbit', 3);
      };
      leaderboardList.innerHTML = '';
      list.forEach((p, i) => {
        const row = el('div', 'leaderRow' + (i < 3 ? ' rank' + (i + 1) : ''));
        const info = el('div', 'leaderInfo');
        const record = el('div', 'leaderRecord');
        record.appendChild(el('span', 'leaderWins', 'W ' + p.w));
        record.appendChild(el('span', 'leaderLosses', 'L ' + p.l));
        info.appendChild(el('div', 'leaderName', p.name));
        info.appendChild(record);
        const score = el('div', 'leaderScore');
        score.appendChild(el('div', 'leaderScoreValue', p.w));
        score.appendChild(el('div', 'leaderScoreLabel', 'SCORE'));
        const badge = el('div', 'leaderBadge', i + 1);
        if (i < 3) addCrownFx(badge, i + 1);
        row.appendChild(badge);
        row.appendChild(info);
        row.appendChild(score);
        leaderboardList.appendChild(row);
      });
    });
  });
  document.getElementById('leaderboardPageBack').addEventListener('click', () => leaderboardPage.classList.remove('open'));
  const settingsPage = document.getElementById('settingsPage');
  const settingsStatus = document.getElementById('settingsStatus');
  const settingsConfirm = document.getElementById('settingsConfirm');
  const settingsBtns = document.querySelectorAll('.settingsBtn');
  const SETTINGS_ACTIONS = {
    usernames: {
      title: 'Delete All Player Usernames?',
      text: 'This will permanently remove all registered player usernames. This cannot be undone.',
      ok: 'Delete',
      done: 'All player usernames deleted.'
    },
    leaderboard: {
      title: 'Clear Leaderboard?',
      text: 'This will permanently remove all leaderboard records. This cannot be undone.',
      ok: 'Clear',
      done: 'Leaderboard cleared.'
    },
    history: {
      title: 'Clear History?',
      text: 'This will permanently delete all stored game history, which also empties the leaderboard. This cannot be undone.',
      ok: 'Clear',
      done: 'Game history cleared.'
    }
  };
  let pendingSettingsAction = null;
  function settingsStatusMsg(text, cls){
    settingsStatus.textContent = text;
    settingsStatus.className = cls || '';
  }
  function closeSettingsConfirm(){
    settingsConfirm.classList.remove('open');
    pendingSettingsAction = null;
  }
  function askSettingsConfirm(kind){
    const a = SETTINGS_ACTIONS[kind];
    pendingSettingsAction = kind;
    document.getElementById('settingsConfirmTitle').textContent = a.title;
    document.getElementById('settingsConfirmText').textContent = a.text;
    document.getElementById('settingsConfirmOk').textContent = a.ok;
    settingsConfirm.classList.add('open');
  }
  document.getElementById('adminSettingsBtn').addEventListener('click', () => {
    settingsStatusMsg('');
    settingsPage.classList.add('open');
  });
  document.getElementById('settingsPageBack').addEventListener('click', () => {
    closeSettingsConfirm();
    settingsPage.classList.remove('open');
  });
  document.getElementById('settingsDeleteUsernamesBtn').addEventListener('click', () => askSettingsConfirm('usernames'));
  document.getElementById('settingsClearLeaderboardBtn').addEventListener('click', () => askSettingsConfirm('leaderboard'));
  document.getElementById('settingsClearHistoryBtn').addEventListener('click', () => askSettingsConfirm('history'));
  document.getElementById('settingsConfirmCancel').addEventListener('click', closeSettingsConfirm);
  settingsConfirm.addEventListener('click', (e) => { if (e.target === settingsConfirm) closeSettingsConfirm(); });
  document.getElementById('settingsConfirmOk').addEventListener('click', () => {
    const kind = pendingSettingsAction;
    closeSettingsConfirm();
    if (!kind) return;
    if (!window.dkAdminClear){ settingsStatusMsg('Unavailable right now', 'err'); return; }
    settingsBtns.forEach(b => { b.disabled = true; });
    settingsStatusMsg('Working...');
    window.dkAdminClear(kind, (ok, err) => {
      settingsBtns.forEach(b => { b.disabled = false; });
      if (ok) settingsStatusMsg(SETTINGS_ACTIONS[kind].done, 'ok');
      else if (err && err.code === 'PERMISSION_DENIED') settingsStatusMsg('Permission denied by the database rules', 'err');
      else settingsStatusMsg('Could not complete the action. Please try again.', 'err');
    });
  });
  function openAdmin(){ input.value = ''; msg.textContent = ''; modal.classList.add('open'); setTimeout(() => input.focus(), 50); }
  function closeAdmin(){ modal.classList.remove('open'); input.value = ''; msg.textContent = ''; }
  function submitAdmin(){
    if (input.value === 'darareeil'){
      closeAdmin();
      window.adminUnlocked = true;
      adminPage.classList.add('open');
    } else {
      msg.textContent = 'Wrong password';
      input.value = '';
    }
  }
  landing.addEventListener('click', (e) => {
    if (landing.classList.contains('hidden')) return;
    if (e.target.closest('#playButton, #landingAvatar, #profileModal, #leaderboardBubble')) return;
    tapCount++;
    if (tapCount < 10) return;
    tapCount = 0;
    openAdmin();
  });
  document.getElementById('adminCancelBtn').addEventListener('click', closeAdmin);
  document.getElementById('adminEnterBtn').addEventListener('click', submitAdmin);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAdmin(); });
})();
</script>
</body>
</html>
